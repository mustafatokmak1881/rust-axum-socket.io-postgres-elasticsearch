<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koalisyon</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(ellipse at 40% 20%, #1a2818, #080a07);
      color: #e8f0d0; font-family: Rajdhani, sans-serif;
    }
    .card {
      max-width: 480px; padding: 32px; border: 1px solid #4a5a40;
      background: #121810ee; text-align: center;
    }
    h1 { font-family: Oswald, sans-serif; letter-spacing: .14em; color: #e8c547; margin: 0 0 8px; }
    p { color: #8a9a78; }
    a {
      display: inline-block; margin-top: 16px; padding: 12px 20px;
      background: #243020; border: 1px solid #e8c54788; color: #e8c547;
      text-decoration: none; font-weight: 700; letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>KOALİSYON</h1>
    <p>Realtime Generals for the web — up to 50 commanders per match. Cosmetics only; no pay-to-win.</p>
    <a href="/auth/google">Sign in with Google</a>
    <p style="margin-top:18px;font-size:12px"><a href="/play" style="border:0;background:none;color:#8a9a78;padding:0">Continue to /play</a></p>
  </div>
</body>
</html>
